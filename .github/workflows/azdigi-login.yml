# AZDIGI fork of the Login V2 app (apps/login). `check` runs on every push/PR to azdigi/** branches;
# `release` builds and pushes ghcr.io/azdigi-official/zitadel-login:<tag> only for protected tags login-v*.
name: azdigi-login

on:
  workflow_dispatch:
  push:
    branches: ['azdigi/**']
    tags: ['login-v*']
  pull_request:
    branches: ['azdigi/**']

permissions:
  contents: read

env:
  NX_NO_CLOUD: 'true'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run-many --target generate --skip-nx-cache
      - run: pnpm nx run @zitadel/login:lint --skip-nx-cache
      - run: pnpm nx run @zitadel/login:test-unit --skip-nx-cache
      - run: node scripts/azdigi/check-locale-keys.mjs en vi
      - name: forbid direct token issuance outside the guarded wrapper (fork policy)
        run: scripts/azdigi/check-guarded-callbacks.sh

  release:
    if: startsWith(github.ref, 'refs/tags/login-v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run-many --target generate --skip-nx-cache
      - name: build (build-time env from apps/login/azdigi-image.vars — one source for local and CI)
        run: |
          set -a; . apps/login/azdigi-image.vars; set +a
          pnpm nx run @zitadel/login:build --skip-nx-cache
      - name: image tag from git tag (login-v4.11.0-azdigi.1 → v4.11.0-azdigi.1)
        id: tag
        run: echo "image=${GITHUB_REF_NAME#login-}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - id: build
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
        with:
          context: apps/login
          push: true
          # amd64 for the server, arm64 for Apple-silicon dev machines; the Dockerfile only copies prebuilt output
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/azdigi-official/zitadel-login:${{ steps.tag.outputs.image }}
          labels: |
            org.opencontainers.image.source=https://github.com/azdigi-official/zitadel
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ghcr.io/azdigi-official/zitadel-login
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - run: echo "digest=${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
